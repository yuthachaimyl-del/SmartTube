gradle.ext.sharedModulesConstants = new File(gradle.ext.sharedModulesRoot, 'constants.gradle')

// git submodule
gradle.ext.mediaServiceCoreRoot = new File(rootDir, '../MediaServiceCore').exists() ? new File(rootDir, '../MediaServiceCore') : new File(rootDir, './MediaServiceCore')
apply from: new File(gradle.ext.mediaServiceCoreRoot, 'core_settings.gradle')

// git submodule
gradle.ext.exoplayerRoot = new File(rootDir, './exoplayer-amzn-2.10.6')
gradle.ext.exoplayerModulePrefix = 'exoplayer-'
apply from: new File(gradle.ext.exoplayerRoot, 'core_settings.gradle')

// Car build: small changes to the upstream submodules (they can't be pushed there), kept as patches in car-patches/
// and applied to the checkout the build really uses, before configuration: <Submodule>-NNNN-name.patch. A patch
// that is already applied is skipped.
def carPatchRoots = ['MediaServiceCore': gradle.ext.mediaServiceCoreRoot, 'SharedModules': gradle.ext.sharedModulesRoot]
// (exoplayer-amzn-2.10.6 is part of this repo: change it directly)
def carRun = { File dir, List<String> cmd ->
    try {
        def proc = new ProcessBuilder(cmd).directory(dir).redirectErrorStream(true).start()
        def out = proc.inputStream.text
        [proc.waitFor(), out]
    } catch (IOException e) {
        throw new GradleException("Car patches: can't run git (is it on the PATH?): ${e.message}")
    }
}
new File(rootDir, 'car-patches').listFiles()?.findAll { it.name.endsWith('.patch') && it.name.contains('-') }?.sort { it.name }?.each { patch ->
    def name = patch.name.substring(0, patch.name.indexOf('-'))
    File module = carPatchRoots[name] ?: new File(rootDir, name)
    if (!new File(module, '.git').exists()) {
        throw new GradleException("Car patch ${patch.name}: ${module} is not a git checkout (run: git submodule update --init --recursive)")
    }
    if (carRun(module, ['git', 'apply', '--reverse', '--check', patch.absolutePath])[0] == 0) {
        return // applied already
    }
    def (code, out) = carRun(module, ['git', 'apply', '--whitespace=nowarn', patch.absolutePath])
    if (code != 0) {
        throw new GradleException("Car patch ${patch.name} doesn't apply to ${module}: ${out}")
    }
    println "Car patch applied: ${patch.name} -> ${module}"
}

