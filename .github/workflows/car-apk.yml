name: Car APK

on:
  push:
    branches: [ "car" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleStstableDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smarttube-car-apk
          path: smarttubetv/build/outputs/apk/ststable/debug/*arm64*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smarttube-car-apk-x86_64
          path: smarttubetv/build/outputs/apk/ststable/debug/*x86_64*.apk
