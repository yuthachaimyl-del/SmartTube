name: Car APK

on:
  push:
    branches: [ "car" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Fixed signing key from repo secret (so each new APK installs over the previous one)
        env:
          CAR_DEBUG_KEYSTORE: ${{ secrets.CAR_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$CAR_DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android && echo "$CAR_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::CAR_DEBUG_KEYSTORE secret not set - APK gets a random key"
          fi
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleStstableDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smarttube-car-apk
          path: smarttubetv/build/outputs/apk/ststable/debug/*arm64*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smarttube-car-apk-x86_64
          path: smarttubetv/build/outputs/apk/ststable/debug/*x86_64*.apk
